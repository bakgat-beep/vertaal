name: Release

# Builds a Windows installer and attaches it to a GitHub Release.
#
# To ship a new version:
#   1. Bump the version number in package.json and src-tauri/Cargo.toml.
#      Tauri names the installer after package.json's version (tauri.conf.json
#      points at it); a test checks Cargo.toml matches, and this workflow
#      stops if the tag and package.json differ.
#   2. Commit that change.
#   3. Create and push a tag starting with "v", e.g.:
#        git tag v0.2.0
#        git push origin v0.2.0
#   4. This workflow runs automatically, builds the installer, and publishes
#      a draft GitHub Release with it attached. Open the Releases page on
#      GitHub, check the draft looks right, and click "Publish release".
#
# You can also run this manually from the "Actions" tab on GitHub (the
# "workflow_dispatch" trigger below) to test that a build succeeds without
# actually publishing a release — useful before cutting a real tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    # Vertaal is a Windows-only app (it writes Paradox game/mod files using
    # Windows-style paths), so this only builds a Windows installer.
    runs-on: windows-latest

    # tauri-action needs write access to create/update the GitHub Release
    # and upload the installer to it — GITHUB_TOKEN defaults to read-only
    # on newer repos, so this has to be requested explicitly.
    permissions:
      contents: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # The installer's file name comes from the version in package.json
      # (tauri.conf.json points at it), not from the tag. Stop here, with a clear
      # message, if someone tagged a release without bumping that number first.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./package.json').version")
          if [ "$tag" != "$app" ]; then
            echo "::error::Tag is v$tag but package.json says version $app. Bump the version (package.json and src-tauri/Cargo.toml), commit, then re-create the tag."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build and (on a tag push) publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only actually create/update a GitHub Release when triggered by a
          # version tag. A manual test run just builds, without publishing.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Vertaal {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false